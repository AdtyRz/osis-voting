<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator - Panitia OSIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    select, input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #1a1a2e;
    }
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(26,26,46,0.3);
    }
    .qr-result {
      margin-top: 30px;
      padding: 30px;
      background: #f8f9fa;
      border-radius: 16px;
      text-align: center;
      display: none;
    }
    .qr-result.active {
      display: block;
    }
    #qrcode {
      display: inline-block;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    #qrcode img {
      display: block;
    }
    .qr-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 15px;
    }
    .qr-code-text {
      font-family: monospace;
      background: #e0e0e0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 15px;
    }
    .btn-download {
      padding: 10px 20px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-download:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }
    .info-box {
      margin-top: 25px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 12px;
      border-left: 4px solid #2196f3;
    }
    .info-box h3 {
      font-size: 13px;
      font-weight: 600;
      color: #1976d2;
      margin-bottom: 8px;
    }
    .info-box p {
      font-size: 12px;
      color: #555;
      line-height: 1.6;
    }
    .paslon-badge {
      display: inline-block;
      padding: 6px 14px;
      background: #1a1a2e;
      color: #fff;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗳️ QR Code Generator</h1>
    <p class="subtitle">Buat QR Code untuk voting OSIS</p>

    <div class="form-group">
      <label>Pilih Pasangan Calon</label>
      <select id="paslon-select">
        <option value="">-- Pilih Paslon --</option>
      </select>
    </div>

    <button class="btn-generate" onclick="generateQR()">Generate QR Code</button>

    <div class="qr-result" id="qr-result">
      <div class="paslon-badge" id="qr-paslon-label"></div>
      <div id="qrcode"></div>
      <p class="qr-info">Scan QR ini untuk memilih paslon di atas</p>
      <div class="qr-code-text" id="qr-code-text"></div>
      <button class="btn-download" onclick="downloadQR()">⬇ Download QR</button>
    </div>

    <div class="info-box">
      <h3>ℹ️ Cara Penggunaan</h3>
      <p>1. Pilih paslon yang ingin dibuat QR Code-nya<br>
         2. Klik "Generate QR Code"<br>
         3. Download dan cetak QR Code<br>
         4. Berikan ke siswa untuk discan saat voting</p>
    </div>
  </div>

  <script>
    const API_BASE = '/api/frontend';
    let paslonData = [];

    // Load data paslon
    async function loadPaslon() {
      try {
        const res = await fetch(`${API_BASE}/paslon.php`);
        const data = await res.json();
        if (data.success) {
          paslonData = data.data.paslon;
          const select = document.getElementById('paslon-select');
          paslonData.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `Paslon ${String(p.nomor_urut).padStart(2,'0')} - ${p.nama_ketua} & ${p.nama_wakil}`;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        console.error('Error loading paslon:', err);
      }
    }

    let qrcodeObj = null;

    function generateQR() {
      const paslonId = document.getElementById('paslon-select').value;
      if (!paslonId) {
        alert('Pilih paslon terlebih dahulu!');
        return;
      }

      const paslon = paslonData.find(p => p.id == paslonId);
      if (!paslon) return;

      // Format QR: OSIS_VOTE:{paslon_id}
      const qrText = `OSIS_VOTE:${paslonId}`;

      // Show result
      document.getElementById('qr-result').classList.add('active');
      document.getElementById('qr-paslon-label').textContent = 
        `Paslon ${String(paslon.nomor_urut).padStart(2,'0')} - ${paslon.nama_ketua} & ${paslon.nama_wakil}`;
      document.getElementById('qr-code-text').textContent = qrText;

      // Generate QR
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      
      if (qrcodeObj) {
        qrcodeObj.makeCode(qrText);
      } else {
        qrcodeObj = new QRCode(container, {
          text: qrText,
          width: 200,
          height: 200,
          colorDark: '#1a1a2e',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    function downloadQR() {
      const qrContainer = document.getElementById('qrcode');
      const img = qrContainer.querySelector('img');
      if (img) {
        const link = document.createElement('a');
        link.href = img.src;
        link.download = `qr-vote-${Date.now()}.png`;
        link.click();
      }
    }

    // Init
    loadPaslon();
  </script>
</body>
</html>
